<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h1>🩺 Diabetes Prediction</h1>
    <p>Enter patient details below</p>

    <form id="predictionForm">

        <div class="form-group">
            <label>Pregnancies</label>
            <input type="number" id="pregnancies" value="1">
        </div>

        <div class="form-group">
            <label>Glucose</label>
            <input type="number" id="glucose" value="100">
        </div>

        <div class="form-group">
            <label>Blood Pressure</label>
            <input type="number" id="bloodPressure" value="70">
        </div>

        <div class="form-group">
            <label>Skin Thickness</label>
            <input type="number" id="skinThickness" value="20">
        </div>

        <div class="form-group">
            <label>Insulin</label>
            <input type="number" id="insulin" value="80">
        </div>

        <div class="form-group">
            <label>BMI</label>
            <input type="number" step="0.1" id="bmi" value="25">
        </div>

        <div class="form-group">
            <label>Diabetes Pedigree Function</label>
            <input type="number" step="0.01" id="dpf" value="0.5">
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" id="age" value="30">
        </div>

        <button type="submit">Predict</button>

    </form>

    <div id="result" class="result">
        <h2>Prediction Result</h2>

        <div id="status"></div>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <p id="probability"></p>

        <div id="recommendations"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
